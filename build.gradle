plugins {
	id 'idea'
	id 'nz.net.ultraq.gradle.fluent-configuration' version '0.10.1'
}

description = 'A twin-stick shooter built using Red Horizon'
version = '0.1.0-SNAPSHOT'

configure {
	createGroovyApplicationProject() {
		mainClass = 'nz.net.ultraq.redhorizon.shooter.Shooter'
	}
		.useJavaVersion(25)
		.useMavenCentralRepositories()
		.configureSource()
			.withSourceDirectory('source')
			.withDependencies() {
				implementation 'ch.qos.logback:logback-classic:1.6.3'
				implementation 'info.picocli:picocli:4.7.7'
				implementation 'nz.net.ultraq.groovy:groovy-extensions:4.0.1'
				implementation 'nz.net.ultraq.redhorizon:redhorizon-runtime:0.44.0-SNAPSHOT'
				implementation 'org.apache.groovy:groovy:5.1.0'
				implementation 'org.joml:joml:1.10.9'
				implementation 'org.joml:joml-primitives:1.10.0'
			}
			.expandExtensionModuleVersion()
			.expand('**/*.properties', [version: version])
}

configurations.configureEach {
	resolutionStrategy {
		cacheChangingModulesFor 0, 'seconds'
		cacheDynamicVersionsFor 0, 'seconds'
	}
}
